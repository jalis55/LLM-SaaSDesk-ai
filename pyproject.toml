[project]
name = "flowdesk-ai"
version = "0.1.0"
description = "SaaS product knowledge assistant using Streamlit and RAG"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "streamlit>=1.40",
  "python-dotenv>=1.0",
  "langchain-core>=0.3",
  "langchain-community>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-groq>=0.3",
  "langchain-huggingface>=0.1",
  "langchain-chroma>=0.2",
  "sentence-transformers>=3.0",
  "chromadb>=0.5",
  "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
